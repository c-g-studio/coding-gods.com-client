name: Linting...
run-name: ${{ github.actor }} linting... 🚀
on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v3
      - name: install node ${{matrix.node-version}}
        uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}
      - name: Install dependencies
        run: npm install
      - name: Set environment variables
        run: |
          echo "TOLGEE_API_URL=${{ secrets.TOLGEE_API_URL }}" >> $GITHUB_ENV
          echo "TOLGEE_API_KEY=${{ secrets.TOLGEE_API_KEY }}" >> $GITHUB_ENV
          echo "PROJECT_ID=${{ secrets.PROJECT_ID }}" >> $GITHUB_ENV
      - name: Download locales
        run: npm run locales
      - name: Linting project
        run: npm run lint
      - name: Build project
        run: npm run build
